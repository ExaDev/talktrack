name: CI

# One workflow for the repository. Every check runs its task through turbo, so the pipeline in turbo.json stays the single definition of what each check does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes that PR's in-flight run. A push to main never cancels: the release job publishes to npm and pushes tags mid-run, and cancelling it partway leaves real work half-done.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the last commit with commitlint
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose
      - name: Validate every PR commit with commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          task: lint
          command: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          task: typecheck
          # _typecheck:attw (attw --pack per published package, checking each package's declared types resolve under every module resolution mode) is one of the tasks `pnpm typecheck` runs through turbo, depending on that package's own _build, so no separate build step is needed to give it a dist/ to inspect.
          command: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          task: test
          command: pnpm test

  test-e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # talktrack's framing pass shells out to the external ffmpeg and ffprobe binaries, so the suite is meaningless without them. The install is not allowed to be skipped or soft-fail, and the checks after it fail the job loudly if the binaries or the VP9 encoder the framing pass selects are absent, rather than letting the suite fail later with a less direct message.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep -q libvpx-vp9
      - uses: ./.github/actions/setup-workspace
        with:
          task: e2e
          command: |
            pnpm exec playwright install --with-deps chromium
            pnpm test:e2e

  # Single stable branch-protection target aggregating every job that runs on every PR, so the required status check doesn't need updating whenever a job is added, renamed, or split.
  required-checks:
    name: Required Checks
    if: always()
    needs: [commitlint, lint, typecheck, test, test-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done

  release:
    name: Release
    needs: [required-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Two pushes to main close together must never run this job at the same time: semantic-release pushes the release commit and tag to main mid-run, and semantic-release's own stale-checkout guard refuses to publish the moment it sees a commit on main this checkout does not have. Queue the second run behind the first rather than cancelling either: cancelling mid-release would leave a published package with no committed version bump.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to push the release commit and tags, and create GitHub Releases
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # OIDC identity for npm trusted publishing (no NPM_TOKEN)
    steps:
      - uses: actions/checkout@v7
        with:
          # main's ruleset requires every change to land via a pull request, and the default GITHUB_TOKEN has no bypass for that: semantic-release's release commit is a direct push to main, so it has to authenticate as an actor the ruleset explicitly allows through. This repository's write deploy key is that actor (a DeployKey bypass_actor on the ruleset), and giving checkout the key makes it configure an SSH remote that every later git push in this job uses. GITHUB_TOKEN stays in the release step below for the GitHub API calls, which a deploy key cannot make.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          # ref: main, not the bare event SHA, so HEAD is attached to the branch and the checkout is the tip of main (semantic-release's own stale-checkout guard refuses to publish when main has a commit this checkout lacks). fetch-depth: 0 because the release range is analysed from the last matching tag.
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          # registry-url is deliberately absent. Setting it makes setup-node write an .npmrc containing an _authToken line, and that line wins over the OIDC token exchange, so the setting that looks like it configures the registry is exactly the one that would stop trusted publishing working.
      - run: pnpm install --frozen-lockfile
      - name: Upgrade npm for OIDC trusted publishing (needs npm CLI >=11.5.1)
        run: npm install -g npm@latest
      - name: Release
        # semantic-release analyses the commits since the last `talktrack@<version>` tag, publishes to npm, commits the version bump and changelog, tags, and creates the GitHub release. HUSKY=0 so local git hooks never fire against the automated commit.
        run: HUSKY=0 pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm publish provenance, matching package.json's own publishConfig.provenance.
          NPM_CONFIG_PROVENANCE: "true"
          # Blanked, not omitted: an inherited NPM_TOKEN/NODE_AUTH_TOKEN from a workflow-level env block, reusable workflow, or composite action would otherwise be used in preference to the OIDC exchange.
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
