# Settings only: this is a single-package repository, so there is no `packages` list. pnpm reads these settings from the root pnpm-workspace.yaml.

# tsdown bundles through esbuild, whose install script fetches the platform binary; without this entry pnpm 11 refuses the install outright.
allowBuilds:
  esbuild: true

# 60 minutes, matching the house repos: fresh enough to pick up fixes promptly, old enough to let a compromised-or-broken brand-new release get yanked before it reaches this repository.
minimumReleaseAge: 60

# Bare package names (no @version), per pnpm's own documented syntax. This is an org-owned package published only by its own semantic-release CI with npm OIDC trusted publishing, so a version-agnostic exemption is deliberate rather than an entry needing an edit on every release.
minimumReleaseAgeExclude:
  - "@exadev/eslint-config"

overrides:
  # release.config.ts's release-notes step uses the conventionalcommits preset, whose templates call a helper that only conventional-changelog-writer@9 or newer provides. @semantic-release/release-notes-generator depends on conventional-changelog-writer@^8, so without this the preset loads and then throws from inside handlebars at render time. Scoped to release-notes-generator because it is the only consumer that renders with the writer at all.
  "@semantic-release/release-notes-generator>conventional-changelog-writer": 9.2.1

# Pin every future pnpm add to the resolved version instead of a caret range, matching the exact pin used for @exadev/eslint-config above.
saveExact: true
