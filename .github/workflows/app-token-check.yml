name: App token check

# Scratch workflow on a throwaway PR branch, never merged: it mints the automerge App token exactly as dependabot-auto-merge.yml does and lists the repositories the installation covers.

on: pull_request

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liuX19EFyXndAmkL
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - run: gh api /installation/repositories --jq "[.repositories[].name] | join(\",\")"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
